<!doctype html>
<html lang="hy" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Բառախույզ — Eastern Armenian Word Explorer. Search 31,769 Armenian words by length, letter positions, included/excluded letters, and difficulty tier.">
<meta name="color-scheme" content="dark light">
<title>Բառախույզ · Eastern Armenian Word Explorer</title>
<style>
/* ════════════════════════════════════════════════════════════════════
   Բառախույզ — Eastern Armenian Word Explorer
   Same editorial palette and typography as Բառախաղ (index.html):
   warm paper ground, ink type, single claret accent, zero shadows.
   ════════════════════════════════════════════════════════════════════ */

:root{
  --bg:#f4f1ea;
  --surface:#fffefb;
  --surface-2:#ede9e0;
  --text:#191714;
  --muted:#6f6a61;
  --line:#e2dcd0;
  --line-strong:#cfc8b9;
  --accent:#8c2f39;
  --accent-ink:#ffffff;

  --correct:#8e293b;
  --present:#c58a83;
  --present-soft:rgba(197,138,131,.22);
  --present-ink:#191714;
  --absent:#ddd8ce;

  --tier-easy:#4c7a5b;
  --tier-medium:#9e7832;
  --tier-hard:#9c4a38;
  --tier-impossible:#6f6a61;

  --radius:7px;
  --card:12px;
}

html[data-theme="dark"]{
  --bg:#161514;
  --surface:#1e1d1b;
  --surface-2:#262421;
  --text:#f2efe8;
  --muted:#9b958b;
  --line:#302d29;
  --line-strong:#43403a;
  --accent:#c4676d;
  --accent-ink:#161514;

  --correct:#8e293b;
  --present:#c58a83;
  --present-soft:rgba(197,138,131,.22);
  --present-ink:#161514;
  --absent:#393632;

  --tier-easy:#74a886;
  --tier-medium:#d0ab5f;
  --tier-hard:#cf7865;
  --tier-impossible:#9b958b;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans Armenian","Mshtakan","Sylfaen","DejaVu Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;
  flex-direction:column;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
a{color:inherit}

/* ── header ───────────────────────────────────────────────────────── */
header{
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; padding:13px 18px;
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
.header-tools{display:flex; gap:4px; align-items:center}

.brand{display:flex; flex-direction:column; align-items:center; line-height:1.15; text-decoration:none}
.brand b{
  font-size:clamp(14px,3.4vw,18px);
  font-weight:600;
  letter-spacing:.30em;
  text-indent:.30em;
  color:var(--text);
}
.brand small{
  font-size:9px; font-weight:500;
  letter-spacing:.16em; text-indent:.16em;
  color:var(--muted);
  margin-top:4px;
}

.iconbtn{
  min-width:34px; height:34px; padding:0 8px;
  border-radius:var(--radius);
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  font-size:12.5px; font-weight:600;
  letter-spacing:.04em;
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  text-decoration:none;
  transition:color .15s, background .15s, border-color .15s;
}
.iconbtn:hover{color:var(--text); background:var(--surface-2); border-color:var(--line)}

/* ── main layout ──────────────────────────────────────────────────── */
.layout{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:18px;
  display:grid;
  grid-template-columns:minmax(340px, 410px) minmax(0, 1fr);
  gap:18px;
  align-items:start;
  flex:1 1 auto;
}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--card);
}

/* ── left filter panel ────────────────────────────────────────────── */
.filters{
  padding:18px 16px;
  display:flex;
  flex-direction:column;
  gap:16px;
  position:sticky;
  top:76px;
}

.section{display:flex; flex-direction:column; gap:7px}
.section-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.label{
  font-size:10.5px; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted);
}
.mini-act{
  border:0; background:transparent; color:var(--muted);
  font-size:10.5px; font-weight:600; padding:2px 5px;
  border-radius:4px; transition:color .15s, background .15s;
}
.mini-act:hover{color:var(--text); background:var(--surface-2)}

/* segmented controls matching index.html */
.seg{
  display:flex; flex-wrap:wrap;
  gap:2px; width:100%;
  border-bottom:1px solid var(--line);
  padding-bottom:3px;
}
.seg button{
  flex:1 1 auto; min-width:0;
  border:0; background:transparent;
  color:var(--muted);
  font-size:11px; font-weight:600;
  letter-spacing:.03em;
  padding:6px 6px;
  border-radius:4px;
  white-space:nowrap;
  transition:color .15s, background .15s;
}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{
  background:var(--accent);
  color:var(--accent-ink);
}
.seg.tiers button{font-size:10px; letter-spacing:0; padding:6px 4px}

/* ── position slots grid ──────────────────────────────────────────── */
.slots-grid{
  display:grid;
  gap:6px;
  justify-content:center;
}
.slot-col{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  min-width:0;
}
.slot-num{
  font-size:10px; font-weight:600; color:var(--muted);
  letter-spacing:.04em;
  user-select:none;
}
.slot-num.opt{opacity:.6}

.slot-exact{
  position:relative;
  width:100%;
  aspect-ratio:1 / 1;
  max-width:56px;
  border:1.5px solid var(--line-strong);
  border-radius:var(--radius);
  background:var(--surface);
  color:var(--text);
  font-size:21px; font-weight:600;
  display:grid; place-items:center;
  cursor:pointer;
  user-select:none;
  transition:border-color .15s, background .15s, color .15s, box-shadow .15s;
}
.slot-exact.w2{font-size:19px; letter-spacing:-.04em}
.slot-exact:hover{border-color:var(--muted)}
.slot-exact.filled{
  background:var(--correct);
  border-color:var(--correct);
  color:#fff;
}
.slot-exact.active{
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 26%, transparent);
}
.slot-exact .ph{
  font-size:13px; color:var(--line-strong); font-weight:500;
}
.slot-exact .clr{
  position:absolute; top:2px; right:3px;
  font-size:10px; line-height:1;
  color:rgba(255,255,255,.78);
  padding:2px;
  display:none;
}
.slot-exact.filled:hover .clr,
.slot-exact.filled.active .clr{display:block}

/* "not at this position" pill box right under each slot */
.slot-not{
  width:100%;
  max-width:56px;
  min-height:28px;
  padding:3px 3px;
  border:1px dashed var(--line-strong);
  border-radius:5px;
  background:var(--bg);
  display:flex; flex-wrap:wrap;
  align-items:center; justify-content:center;
  gap:2px;
  cursor:pointer;
  transition:border-color .15s, background .15s, box-shadow .15s;
}
.slot-not:hover{border-color:var(--muted)}
.slot-not.has-items{
  border-style:solid;
  border-color:var(--present);
  background:var(--present-soft);
}
.slot-not.active{
  border-style:solid;
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent);
}
.slot-not .ph{
  font-size:10px; color:var(--muted); opacity:.7; user-select:none;
}
.not-chip{
  font-size:11px; font-weight:600; line-height:1.15;
  padding:1px 4px;
  border-radius:3px;
  background:var(--present);
  color:var(--present-ink);
  display:inline-flex; align-items:center; gap:2px;
}
.not-chip:hover{opacity:.82}

.yellow-toggle{
  display:flex; align-items:center; gap:7px;
  font-size:11px; color:var(--muted);
  cursor:pointer; user-select:none;
  margin-top:2px;
}
.yellow-toggle input{accent-color:var(--accent); margin:0; cursor:pointer}

/* ── chip fields (Contains / Exclude) ─────────────────────────────── */
.chip-field{
  min-height:40px;
  padding:6px 8px;
  border:1.5px solid var(--line-strong);
  border-radius:var(--radius);
  background:var(--bg);
  display:flex; flex-wrap:wrap; align-items:center; gap:5px;
  cursor:text;
  transition:border-color .15s, box-shadow .15s;
}
.chip-field:hover{border-color:var(--muted)}
.chip-field.active{
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent);
}
.chip-field .ph{
  font-size:11.5px; color:var(--muted); opacity:.78; user-select:none;
}
.chip{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 7px;
  border-radius:5px;
  font-size:13px; font-weight:600; line-height:1.1;
  user-select:none;
  cursor:pointer;
  transition:opacity .12s;
}
.chip:hover{opacity:.82}
.chip.present{background:var(--present); color:var(--present-ink)}
.chip.absent{background:var(--absent); color:var(--text)}
.chip small{font-size:10px; opacity:.7}

/* ── on-screen phonetic Armenian keyboard ─────────────────────────── */
.kb-wrap{
  border-top:1px solid var(--line);
  padding-top:12px;
  display:flex; flex-direction:column; gap:8px;
}
.kb-bar{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.kb-target{
  font-size:10.5px; color:var(--accent); font-weight:600;
  letter-spacing:.02em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.keyboard{
  display:flex; flex-direction:column; gap:4px;
}
.keyboard[hidden]{display:none}
.krow{
  display:flex; gap:3px; justify-content:center;
}
.key{
  flex:1 1 0;
  min-width:0;
  height:32px;
  border:1px solid var(--line);
  border-radius:5px;
  background:var(--bg);
  color:var(--text);
  font-size:13.5px; font-weight:600;
  display:grid; place-items:center;
  padding:0;
  transition:background .12s, border-color .12s, transform .06s;
}
.key.w2{font-size:11px; letter-spacing:-.03em}
.key:hover{background:var(--surface-2); border-color:var(--line-strong)}
.key:active{transform:translateY(1px)}
.key.act{
  flex:1.5 1 0;
  font-size:11px; color:var(--muted);
}
.key.k-exact{background:var(--correct); border-color:var(--correct); color:#fff}
.key.k-present{background:var(--present); border-color:var(--present); color:var(--present-ink)}
.key.k-absent{opacity:.42}

.action-row{
  display:flex; gap:8px;
}
.btn{
  flex:1;
  border:1px solid var(--line-strong);
  border-radius:var(--radius);
  padding:9px 12px;
  background:transparent;
  color:var(--text);
  font-size:11.5px; font-weight:600;
  letter-spacing:.04em;
  transition:background .15s, border-color .15s, opacity .15s;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{opacity:.88; background:var(--accent)}

/* ── right results panel ──────────────────────────────────────────── */
.results{
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
  min-width:0;
}

.res-head{
  display:flex; flex-wrap:wrap;
  align-items:center; justify-content:space-between;
  gap:10px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.res-count-wrap{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.res-count{font-size:18px; font-weight:600; letter-spacing:-.01em}
.res-pattern{
  font-size:12px; font-weight:600;
  letter-spacing:.14em;
  color:var(--accent);
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:5px;
  padding:3px 8px;
}
.res-pattern:empty{display:none}

.res-tools{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.res-tools select{
  background:var(--bg); color:var(--text);
  border:1px solid var(--line-strong); border-radius:var(--radius);
  padding:6px 9px; font-family:inherit; font-size:11.5px; font-weight:600;
}
.tool-btn{
  border:1px solid var(--line-strong);
  border-radius:var(--radius);
  background:var(--bg);
  color:var(--text);
  font-size:11.5px; font-weight:600;
  padding:6px 10px;
  transition:background .15s;
}
.tool-btn:hover{background:var(--surface-2)}

/* tier breakdown pills */
.breakdown{
  display:flex; flex-wrap:wrap; gap:6px;
}
.bd-pill{
  border:1px solid var(--line);
  background:var(--bg);
  border-radius:999px;
  padding:4px 10px;
  font-size:11px; font-weight:600;
  color:var(--muted);
  display:inline-flex; align-items:center; gap:6px;
  transition:border-color .15s, background .15s, color .15s;
}
.bd-pill:hover{border-color:var(--line-strong); color:var(--text)}
.bd-pill.active{border-color:var(--accent); color:var(--text); background:var(--surface-2)}
.dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
.dot.easy{background:var(--tier-easy)}
.dot.medium{background:var(--tier-medium)}
.dot.hard{background:var(--tier-hard)}
.dot.impossible{background:var(--tier-impossible)}

/* word grid */
.word-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(126px, 1fr));
  gap:8px;
}
.wcard{
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--bg);
  padding:9px 10px;
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  text-align:left;
  transition:border-color .14s, background .14s, transform .08s;
}
.wcard:hover{border-color:var(--line-strong); background:var(--surface-2)}
.wcard:active{transform:translateY(1px)}
.wcard.selected{border-color:var(--accent); background:var(--surface-2)}

.wtext{
  font-size:15px; font-weight:600;
  letter-spacing:.03em;
  line-height:1.2;
  overflow-wrap:anywhere;
}
.wtext .hl-exact{color:var(--accent)}
.wtext .hl-present{
  text-decoration:underline;
  text-decoration-color:var(--present);
  text-decoration-thickness:2px;
  text-underline-offset:3px;
}
.wmeta{
  display:flex; align-items:center; gap:4px; flex:0 0 auto;
}
.wlen{
  font-size:9.5px; font-weight:600; color:var(--muted);
  opacity:.75;
}

/* empty state & pagination */
.empty{
  padding:36px 16px;
  text-align:center;
  color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.empty b{color:var(--text); font-size:14px}
.empty p{margin:0; font-size:12.5px; line-height:1.6; max-width:360px}

.more-row{
  display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
  padding-top:6px;
}
.more-row .btn{flex:0 1 auto; min-width:140px}

/* ── toast ────────────────────────────────────────────────────────── */
.toast{
  position:fixed; left:50%; top:72px; transform:translate(-50%,-12px);
  background:var(--text); color:var(--surface);
  padding:9px 15px; border-radius:var(--radius);
  font-size:12px; font-weight:600; letter-spacing:.02em;
  opacity:0; pointer-events:none; transition:.2s; z-index:60;
  max-width:88vw; text-align:center;
}
.toast.show{opacity:1; transform:translate(-50%,0)}

/* ── modals (Word detail + Help) ──────────────────────────────────── */
.scrim{
  position:fixed; inset:0; background:rgba(25,23,20,.38);
  display:none; align-items:center; justify-content:center;
  padding:16px; z-index:50;
}
.scrim.open{display:flex}
.modal{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--card);
  box-shadow:0 20px 50px rgba(25,23,20,.14);
  padding:22px; width:100%; max-width:440px; max-height:88dvh; overflow:auto;
}
.modal h2{
  margin:0 0 14px; font-size:15px; font-weight:600;
  letter-spacing:.07em;
  display:flex; justify-content:space-between; align-items:center;
  padding-bottom:11px; border-bottom:1px solid var(--line);
}
.modal h2 button{
  border:0; background:transparent; font-size:17px;
  color:var(--muted); padding:0 2px; line-height:1;
}
.modal p, .modal li{font-size:12.5px; line-height:1.7; color:var(--text)}
.modal .muted{color:var(--muted); font-size:11.5px}

.tile-preview{
  display:flex; justify-content:center; gap:6px; margin:16px 0 14px;
}
.tile-preview span{
  width:46px; height:46px;
  border:1.5px solid var(--line-strong);
  border-radius:var(--radius);
  display:grid; place-items:center;
  font-size:21px; font-weight:600;
  background:var(--bg);
}
.tile-preview span.w2{font-size:19px; letter-spacing:-.04em}
.tile-preview span.hl-exact{background:var(--correct); border-color:var(--correct); color:#fff}
.tile-preview span.hl-present{background:var(--present); border-color:var(--present); color:var(--present-ink)}

.detail-meta{
  display:grid; grid-template-columns:repeat(3, 1fr);
  gap:8px; margin:14px 0 16px; text-align:center;
}
.detail-meta div{
  border:1px solid var(--line); border-radius:var(--radius);
  padding:9px 6px; background:var(--bg);
}
.detail-meta b{display:block; font-size:13.5px; font-weight:600}
.detail-meta small{font-size:10px; color:var(--muted); letter-spacing:.04em}

.btnrow{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.btnrow a.btn{text-decoration:none; text-align:center; display:grid; place-items:center}

.corpus{
  margin-top:14px; padding-top:12px;
  border-top:1px solid var(--line);
  font-size:10.5px; color:var(--muted); line-height:1.7;
}

/* ── responsive ───────────────────────────────────────────────────── */
@media (max-width:860px){
  .layout{
    grid-template-columns:1fr;
    padding:12px;
    gap:12px;
  }
  .filters{
    position:static;
    padding:14px 12px;
  }
  .results{padding:14px 12px}
  .word-grid{grid-template-columns:repeat(auto-fill, minmax(112px, 1fr))}
}
@media (max-width:440px){
  header{padding:10px 12px}
  .iconbtn .lbl{display:none}
  .slot-exact{font-size:18px}
  .key{height:30px; font-size:12.5px}
}
</style>
</head>
<body>

<header>
  <div class="header-tools">
    <a class="iconbtn" href="index.html" id="btnBack" title="Բառախաղ">← <span class="lbl" data-i18n="gameLink">Խաղ</span></a>
    <button class="iconbtn" id="btnHelp" aria-label="Help" title="Help">?</button>
  </div>
  <div class="brand">
    <b data-i18n="title">ԲԱՌԱԽՈՒՅԶ</b>
    <small data-i18n="subtitle">բառերի որոնիչ · արևելահայերեն</small>
  </div>
  <div class="header-tools">
    <button class="iconbtn" id="btnLang" title="Language">EN</button>
    <button class="iconbtn" id="btnTheme" title="Theme">☾</button>
  </div>
</header>

<div class="layout">

  <aside class="panel filters" aria-label="Filters">

    <div class="section">
      <div class="section-head">
        <span class="label" data-i18n="lblLength">Երկարություն</span>
        <span class="muted" id="lenInfo" style="font-size:10.5px"></span>
      </div>
      <div class="seg" id="segLen" role="group"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="label" data-i18n="lblTier">Մակարդակ</span>
      </div>
      <div class="seg tiers" id="segTier" role="group"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="label" data-i18n="lblPositions">Տառերի դիրքերը</span>
        <button class="mini-act" id="btnClearPos" data-i18n="clear">Մաքրել</button>
      </div>
      <div class="slots-grid" id="slotsGrid"></div>
      <label class="yellow-toggle">
        <input type="checkbox" id="chkYellow">
        <span data-i18n="yellowRule">«≠» տառերը պարտադիր կան բառի մեջ (Wordle կանոն)</span>
      </label>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="label" data-i18n="lblContains">Պարունակում է (ցանկացած տեղում)</span>

/* ---------- 1. Armenian grapheme handling (shared with index.html) ---------- */
const KB_ROWS = [
  ["է","թ","փ","ձ","ջ","ւ","և","ր","չ","ճ","ժ"],
  ["ք","ո","ե","ռ","տ","ը","ի","օ","պ","խ","ծ"],
  ["ա","ս","դ","ֆ","գ","հ","յ","կ","լ","շ"],
  ["զ","ղ","ց","վ","բ","ն","մ","ու"],
];
const KEYS = KB_ROWS.flat();
const KEY_SET = new Set(KEYS);

const ALPHA_ORDER = [
  "ա","բ","գ","դ","ե","զ","է","ը","թ","ժ","ի","լ","խ","ծ","կ","հ","ձ","ղ","ճ",
  "մ","յ","ն","շ","ո","չ","պ","ջ","ռ","ս","վ","տ","ր","ց","ւ","ու","փ","ք","և","օ","ֆ"
];
const ALPHA_RANK = Object.fromEntries(ALPHA_ORDER.map((ch, i) => [ch, i]));

const norm = (s) => s.toLowerCase().replace(/\u0565\u0582/g, "\u0587");
function toTiles(word){
  const w = norm(word), out = [];
  for (let i = 0; i < w.length; i++){
    if (w[i] === "ո" && w[i+1] === "ւ"){ out.push("ու"); i++; }
    else out.push(w[i]);
  }
  return out;
}
function compareArmenian(a, b){
  const ta = a.tiles, tb = b.tiles;
  const n = Math.min(ta.length, tb.length);
  for (let i = 0; i < n; i++){
    if (ta[i] !== tb[i]){
      const ra = ALPHA_RANK[ta[i]] ?? 999;
      const rb = ALPHA_RANK[tb[i]] ?? 999;
      if (ra !== rb) return ra - rb;
      return ta[i].localeCompare(tb[i]);
    }
  }
  return ta.length - tb.length;
}

/* ---------- 2. Pre-indexed corpus ---------- */
const META = DATA.meta;
const POOLS = DATA.words;
const LENGTHS = Object.keys(POOLS).map(Number).sort((a,b) => a - b);
const MAX_LEN = Math.max(...LENGTHS);
const BASE_TIERS = ["easy","medium","hard","impossible"];
const LM_TIERS = new Set(["easy","medium","hard"]);
const TIER_FILTERS = ["all","easy","medium","hard","lm","impossible"];

const ALL_ENTRIES = [];
const ENTRIES_BY_LEN = {};
LENGTHS.forEach(L => {
  const list = [];
  let rank = 1;
  BASE_TIERS.forEach(tr => {
    (POOLS[L][tr] || []).forEach(word => {
      const tiles = toTiles(word);
      const counts = {};
      for (let i = 0; i < tiles.length; i++){
        counts[tiles[i]] = (counts[tiles[i]] || 0) + 1;
      }
      const entry = { word, len: L, tier: tr, tiles, counts, rank: rank++ };
      list.push(entry);
      ALL_ENTRIES.push(entry);
    });
  });
  ENTRIES_BY_LEN[L] = list;
});

/* ---------- 4. Shared settings & explorer state ---------- */
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

let MEM = {};
function readSharedCfg(){
  try{ return JSON.parse(localStorage.getItem("hywordle:cfg") || "null") || {}; }
  catch(e){ return MEM.cfg || {}; }
}
function saveSharedPref(patch){
  const cur = readSharedCfg();
  const next = Object.assign({}, cur, patch);
  try{ localStorage.setItem("hywordle:cfg", JSON.stringify(next)); }
  catch(e){ MEM.cfg = next; }
}

const shared = readSharedCfg();
const state = {
  lang: shared.lang === "en" ? "en" : "hy",
  theme: shared.theme === "dark" ? "dark" : "light",
  len: 5,               // 4 | 5 | 6 | 0 (all)
  tier: "all",          // all | easy | medium | hard | lm | impossible
  exact: Array(MAX_LEN).fill(""),
  notAt: Array.from({length: MAX_LEN}, () => []),
  contains: [],         // array of grapheme tiles (allows repeats)
  exclude: [],          // array of unique grapheme tiles
  yellowRule: false,
  sort: "freq",         // freq | alpha
  kbOpen: true,
  target: { type: "exact", idx: 0 },
  limit: 240,
  lastMatches: [],
  selectedWord: null,
};

const t = (k) => (I18N[state.lang] && I18N[state.lang][k]) || I18N.hy[k] || k;
const tierLabel = (tr) => t(tr);
const activeSlotCount = () => state.len === 0 ? MAX_LEN : state.len;

/* ---------- 5. Core matching engine ---------- */
function matchesConstraints(entry, tierOverride){
  const tier = tierOverride ?? state.tier;
  if (tier === "lm"){
    if (!LM_TIERS.has(entry.tier)) return false;
  } else if (tier !== "all"){
    if (entry.tier !== tier) return false;
  }

  const slotCount = activeSlotCount();
  const tiles = entry.tiles;

  // 1. Exact positions & not-at positions
  for (let i = 0; i < slotCount; i++){
    const ex = state.exact[i];
    if (ex){
      if (i >= tiles.length || tiles[i] !== ex) return false;
    }
    const na = state.notAt[i];
    if (na.length && i < tiles.length){
      for (let j = 0; j < na.length; j++){
        if (tiles[i] === na[j]) return false;
      }
    }
  }

  // 2. Minimum letter counts from Contains (+ optionally yellowRule from notAt)
  const minReq = {};
  for (let i = 0; i < state.contains.length; i++){
    const ch = state.contains[i];
    minReq[ch] = (minReq[ch] || 0) + 1;
  }
  if (state.yellowRule){
    const seenNot = new Set();
    for (let i = 0; i < slotCount; i++){
      for (let j = 0; j < state.notAt[i].length; j++) seenNot.add(state.notAt[i][j]);
    }
    seenNot.forEach(ch => { if (!minReq[ch]) minReq[ch] = 1; });
  }
  for (const ch in minReq){
    if ((entry.counts[ch] || 0) < minReq[ch]) return false;
  }

  // 3. Excluded letters (Wordle-safe: if letter is also confirmed in exact/minReq,
  //    cap its total count at that confirmed count rather than contradicting it)
  if (state.exclude.length){
    let exactCounts = null;
    for (let i = 0; i < state.exclude.length; i++){
      const ch = state.exclude[i];
      const hasCount = entry.counts[ch] || 0;
      if (hasCount === 0) continue;
      if (!exactCounts){
        exactCounts = {};
        for (let p = 0; p < slotCount; p++){
          if (state.exact[p]) exactCounts[state.exact[p]] = (exactCounts[state.exact[p]] || 0) + 1;
        }
      }
      const allowed = Math.max(exactCounts[ch] || 0, minReq[ch] || 0);
      if (hasCount > allowed) return false;
    }
  }

  return true;
}

function runSearch(){
  const pool = state.len === 0 ? ALL_ENTRIES : (ENTRIES_BY_LEN[state.len] || []);
  const tierCounts = { easy: 0, medium: 0, hard: 0, impossible: 0 };
  const matches = [];
  let allTierCount = 0;

  for (let i = 0; i < pool.length; i++){
    const e = pool[i];
    if (matchesConstraints(e, "all")){
      tierCounts[e.tier]++;
      allTierCount++;
      if (matchesConstraints(e, state.tier)) matches.push(e);
    }
  }

  if (state.sort === "alpha") matches.sort(compareArmenian);

  state.lastMatches = matches;
  renderResults(matches, tierCounts, allTierCount);
  updateKeyboardHighlights();
}

/* ---------- 6. Input & editing logic ---------- */
function setTarget(target){
  state.target = target;
  if (state.target.type === "exact" || state.target.type === "notAt"){
    const maxIdx = activeSlotCount() - 1;
    if (state.target.idx > maxIdx) state.target.idx = maxIdx;
  }
  renderSlots();
  renderChipFields();
  renderKbTarget();
}

function handleLetterInput(rawCh){
  const ch = norm(rawCh);
  if (!KEY_SET.has(ch)) return;
  const tgt = state.target;
  const maxSlots = activeSlotCount();

  if (tgt.type === "exact"){
    const i = tgt.idx;
    // Digraph folding: if current slot has ո/ե and user types ւ, fold in place
    if (ch === "ւ" && state.exact[i] === "ո"){
      state.exact[i] = "ու";
      if (i + 1 < maxSlots) tgt.idx = i + 1;
    } else if (ch === "ւ" && state.exact[i] === "ե"){
      state.exact[i] = "և";
      if (i + 1 < maxSlots) tgt.idx = i + 1;
    } else if (ch === "ւ" && !state.exact[i] && i > 0 && state.exact[i - 1] === "ո"){
      // Auto-advanced after typing ո, now user types ւ -> fold previous slot into ու
      state.exact[i - 1] = "ու";
    } else if (ch === "ւ" && !state.exact[i] && i > 0 && state.exact[i - 1] === "ե"){
      state.exact[i - 1] = "և";
    } else {
      state.exact[i] = ch;
      // Remove conflicting notAt on same slot
      state.notAt[i] = state.notAt[i].filter(x => x !== ch);
      if (i + 1 < maxSlots) tgt.idx = i + 1;
    }
  } else if (tgt.type === "notAt"){
    const arr = state.notAt[tgt.idx];
    if (ch === "ւ" && arr.length && arr[arr.length - 1] === "ո"){
      arr[arr.length - 1] = "ու";
      state.notAt[tgt.idx] = Array.from(new Set(arr));
    } else if (ch === "ւ" && arr.length && arr[arr.length - 1] === "ե"){
      arr[arr.length - 1] = "և";
      state.notAt[tgt.idx] = Array.from(new Set(arr));
    } else if (!arr.includes(ch)){
      arr.push(ch);
      if (state.exact[tgt.idx] === ch) state.exact[tgt.idx] = "";
    }
  } else if (tgt.type === "contains"){
    const arr = state.contains;
    if (ch === "ւ" && arr.length && arr[arr.length - 1] === "ո"){
      arr[arr.length - 1] = "ու";
    } else if (ch === "ւ" && arr.length && arr[arr.length - 1] === "ե"){
      arr[arr.length - 1] = "և";
    } else if (arr.length < MAX_LEN){
      arr.push(ch);
    }
  } else if (tgt.type === "exclude"){
    const arr = state.exclude;
    if (ch === "ւ" && arr.length && arr[arr.length - 1] === "ո"){
      arr[arr.length - 1] = "ու";
      state.exclude = Array.from(new Set(arr));
    } else if (ch === "ւ" && arr.length && arr[arr.length - 1] === "ե"){
      arr[arr.length - 1] = "և";
      state.exclude = Array.from(new Set(arr));
    } else if (!arr.includes(ch)){
      arr.push(ch);
    }
  }

  state.limit = 240;
  renderFilterUI();
  runSearch();
}

function handleWildcard(){
  if (state.target.type !== "exact") return;
  const i = state.target.idx;
  state.exact[i] = "";
  if (i + 1 < activeSlotCount()) state.target.idx = i + 1;
  state.limit = 240;
  renderFilterUI();
  runSearch();
}

function handleBackspace(){
  const tgt = state.target;
  if (tgt.type === "exact"){
    if (state.exact[tgt.idx]){
      state.exact[tgt.idx] = "";
    } else if (tgt.idx > 0){
      tgt.idx--;
      state.exact[tgt.idx] = "";
    }
  } else if (tgt.type === "notAt"){
    state.notAt[tgt.idx].pop();
  } else if (tgt.type === "contains"){
    state.contains.pop();
  } else if (tgt.type === "exclude"){
    state.exclude.pop();
  }
  state.limit = 240;
  renderFilterUI();
  runSearch();
}

function handlePastePattern(text){
  const cleaned = norm(text.trim());
  if (!cleaned) return;
  if (state.target.type === "exact"){
    const tiles = [];
    for (let i = 0; i < cleaned.length; i++){
      const c = cleaned[i];
      if (c === "ո" && cleaned[i + 1] === "ւ"){ tiles.push("ու"); i++; }
      else if (KEY_SET.has(c)) tiles.push(c);
      else if (c === "_" || c === "?" || c === "." || c === "*" || c === "-" || c === " ") tiles.push("");
    }
    if (!tiles.length) return;
    if (LENGTHS.includes(tiles.length)) state.len = tiles.length;
    const n = activeSlotCount();
    for (let i = 0; i < MAX_LEN; i++) state.exact[i] = i < tiles.length && i < n ? tiles[i] : "";
    state.limit = 240;
    renderControls();
    renderFilterUI();
    runSearch();
  } else {
    toTiles(cleaned).forEach(ch => { if (KEY_SET.has(ch)) handleLetterInput(ch); });
  }
}

/* ---------- 7. Rendering ---------- */
function renderControls(){
  const segLen = $("#segLen");
  const lenOpts = [...LENGTHS, 0];
  segLen.innerHTML = lenOpts.map(L =>
    `<button data-len="${L}" aria-pressed="${L === state.len}">${L === 0 ? t("allLen") : L}</button>`
  ).join("");
  const totalForLen = (state.len === 0 ? ALL_ENTRIES : ENTRIES_BY_LEN[state.len]).length;
  $("#lenInfo").textContent = totalForLen.toLocaleString("en-US") + " " + t("wordsUnit");

  const segTier = $("#segTier");
  segTier.innerHTML = TIER_FILTERS.map(tr =>
    `<button data-tier="${tr}" aria-pressed="${tr === state.tier}">${tierLabel(tr)}</button>`
  ).join("");
}

function renderSlots(){
  const grid = $("#slotsGrid");
  const count = activeSlotCount();
  grid.style.gridTemplateColumns = `repeat(${count}, minmax(0, 1fr))`;

  let html = "";
  for (let i = 0; i < count; i++){
    const ex = state.exact[i];
    const na = state.notAt[i];
    const exActive = state.target.type === "exact" && state.target.idx === i;
    const naActive = state.target.type === "notAt" && state.target.idx === i;
    const optNum = state.len === 0 && i >= LENGTHS[0];

    html += `<div class="slot-col">` +
      `<span class="slot-num${optNum ? " opt" : ""}">${i + 1}${optNum ? "?" : ""}</span>` +
      `<div class="slot-exact${ex ? " filled" : ""}${ex.length > 1 ? " w2" : ""}${exActive ? " active" : ""}" data-slot-exact="${i}" tabindex="0" role="button" aria-label="Position ${i+1}">` +
        (ex ? `<span>${ex}</span><span class="clr" data-clear-exact="${i}" title="${t("clear")}">✕</span>` : `<span class="ph">_</span>`) +
      `</div>` +
      `<div class="slot-not${na.length ? " has-items" : ""}${naActive ? " active" : ""}" data-slot-not="${i}" tabindex="0" role="button" aria-label="Not at position ${i+1}">` +
        (na.length
          ? na.map((c, j) => `<span class="not-chip" data-rm-not="${i}:${j}">${c}</span>`).join("")
          : `<span class="ph">≠</span>`) +
      `</div>` +
    `</div>`;
  }
  grid.innerHTML = html;
}

function renderChipFields(){
  const fc = $("#fieldContains");
  const fe = $("#fieldExclude");
  fc.classList.toggle("active", state.target.type === "contains");
  fe.classList.toggle("active", state.target.type === "exclude");

  fc.innerHTML = state.contains.length
    ? state.contains.map((c, i) => `<span class="chip present" data-rm-contains="${i}">${c}<small>✕</small></span>`).join("")
    : `<span class="ph">${t("phContains")}</span>`;

  fe.innerHTML = state.exclude.length
    ? state.exclude.map((c, i) => `<span class="chip absent" data-rm-exclude="${i}">${c}<small>✕</small></span>`).join("")
    : `<span class="ph">${t("phExclude")}</span>`;
}

function renderKbTarget(){
  const tgt = state.target;
  let txt = "";
  if (tgt.type === "exact") txt = t("tgtExact") + (tgt.idx + 1);
  else if (tgt.type === "notAt") txt = t("tgtNotAt") + (tgt.idx + 1);
  else if (tgt.type === "contains") txt = t("tgtContains");
  else if (tgt.type === "exclude") txt = t("tgtExclude");
  $("#kbTarget").textContent = txt;
  $("#btnToggleKb").textContent = state.kbOpen ? t("kbHide") : t("kbShow");
  $("#keyboard").hidden = !state.kbOpen;
}

function renderFilterUI(){
  renderSlots();
  renderChipFields();
  renderKbTarget();
}

function buildKeyboard(){
  const kb = $("#keyboard");
  kb.innerHTML = "";
  KB_ROWS.forEach((rowKeys, idx) => {
    const row = document.createElement("div");
    row.className = "krow";
    const isBottom = idx === KB_ROWS.length - 1;
    if (isBottom){
      const wild = document.createElement("button");
      wild.className = "key act";
      wild.textContent = "_";
      wild.title = "Blank / Skip slot";
      wild.onclick = handleWildcard;
      row.appendChild(wild);
    }
    rowKeys.forEach(k => {
      const b = document.createElement("button");
      b.className = "key" + (k.length > 1 ? " w2" : "");
      b.textContent = k;
      b.dataset.key = k;
      b.onclick = () => handleLetterInput(k);
      row.appendChild(b);
    });
    if (isBottom){
      const del = document.createElement("button");
      del.className = "key act";
      del.textContent = "⌫";
      del.title = "Backspace";
      del.onclick = handleBackspace;
      row.appendChild(del);
    }
    kb.appendChild(row);
  });
  updateKeyboardHighlights();
}

function updateKeyboardHighlights(){
  const count = activeSlotCount();
  const exactSet = new Set();
  const presentSet = new Set(state.contains);
  for (let i = 0; i < count; i++){
    if (state.exact[i]) exactSet.add(state.exact[i]);
    if (state.yellowRule) state.notAt[i].forEach(c => presentSet.add(c));
  }
  const excludeSet = new Set(state.exclude);
  $$("#keyboard .key[data-key]").forEach(b => {
    const k = b.dataset.key;
    b.classList.remove("k-exact","k-present","k-absent");
    if (exactSet.has(k)) b.classList.add("k-exact");
    else if (presentSet.has(k)) b.classList.add("k-present");
    else if (excludeSet.has(k)) b.classList.add("k-absent");
  });
}

function formatWordHighlighted(entry){
  const count = activeSlotCount();
  const presentSet = new Set(state.contains);
  if (state.yellowRule){
    for (let i = 0; i < count; i++) state.notAt[i].forEach(c => presentSet.add(c));
  }
  let out = "";
  for (let i = 0; i < entry.tiles.length; i++){
    const tl = entry.tiles[i];
    if (i < count && state.exact[i] === tl){
      out += `<span class="hl-exact">${tl}</span>`;
    } else if (presentSet.has(tl)){
      out += `<span class="hl-present">${tl}</span>`;
    } else {
      out += tl;
    }
  }
  return out;
}

function renderResults(matches, tierCounts, allTierCount){
  $("#resCount").textContent = matches.length.toLocaleString("en-US") + " " + t("wordsUnit");

  // Active pattern badge
  const count = activeSlotCount();
  const hasAnyExact = state.exact.slice(0, count).some(Boolean);
  $("#resPattern").textContent = hasAnyExact
    ? state.exact.slice(0, count).map(c => c || "_").join(" ")
    : "";

  // Tier breakdown bar
  const lmCount = tierCounts.easy + tierCounts.medium + tierCounts.hard;
  const bd = $("#breakdown");
  bd.innerHTML =
    `<button class="bd-pill${state.tier === "all" ? " active" : ""}" data-bd="all">${t("all")} · ${allTierCount.toLocaleString("en-US")}</button>` +
    `<button class="bd-pill${state.tier === "lm" ? " active" : ""}" data-bd="lm">${t("lm")} · ${lmCount.toLocaleString("en-US")}</button>` +
    BASE_TIERS.map(tr =>
      `<button class="bd-pill${state.tier === tr ? " active" : ""}" data-bd="${tr}"><i class="dot ${tr}"></i>${t(tr)} · ${tierCounts[tr].toLocaleString("en-US")}</button>`
    ).join("");

  const grid = $("#wordGrid");
  const empty = $("#emptyBox");
  const more = $("#moreRow");

  if (!matches.length){
    grid.innerHTML = "";
    more.hidden = true;
    empty.hidden = false;
    let extra = "";
    if (state.tier !== "all" && allTierCount > 0){
      extra = `<p>${t("emptyOtherTier")}<b>${allTierCount.toLocaleString("en-US")}</b> ${t("wordsUnit")}.</p>` +
        `<button class="btn primary" style="flex:0 0 auto; min-width:180px" id="btnSwitchAll">${t("switchAll")}</button>`;
    } else {
      extra = `<p>${t("emptyHint")}</p>`;
    }
    empty.innerHTML = `<b>${t("emptyTitle")}</b>${extra}`;
    const sw = $("#btnSwitchAll");
    if (sw) sw.onclick = () => { state.tier = "all"; state.limit = 240; renderControls(); runSearch(); };
    return;
  }

  empty.hidden = true;
  const slice = matches.slice(0, state.limit);
  const showLen = state.len === 0;
  grid.innerHTML = slice.map((e, idx) =>
    `<button class="wcard" data-idx="${idx}">` +
      `<span class="wtext">${formatWordHighlighted(e)}</span>` +
      `<span class="wmeta">${showLen ? `<span class="wlen">${e.len}</span>` : ""}<i class="dot ${e.tier}" title="${t(e.tier)}"></i></span>` +
    `</button>`
  ).join("");

  const remaining = matches.length - slice.length;
  if (remaining > 0){
    more.hidden = false;
    const step = Math.min(240, remaining);
    more.innerHTML =
      `<button class="btn" id="btnShowMore">${t("showMore")}${step.toLocaleString("en-US")}</button>` +
      `<button class="btn" id="btnShowAll">${t("showAll")} (${matches.length.toLocaleString("en-US")})</button>`;
    $("#btnShowMore").onclick = () => { state.limit += 240; renderResults(state.lastMatches, tierCounts, allTierCount); };
    $("#btnShowAll").onclick = () => { state.limit = matches.length; renderResults(state.lastMatches, tierCounts, allTierCount); };
  } else {
    more.hidden = true;
  }
}

function openWordDetail(entry){
  state.selectedWord = entry;
  $("#detTitle").textContent = entry.word;

  const count = activeSlotCount();
  const presentSet = new Set(state.contains);
  if (state.yellowRule){
    for (let i = 0; i < count; i++) state.notAt[i].forEach(c => presentSet.add(c));
  }
  $("#detTiles").innerHTML = entry.tiles.map((tl, i) => {
    let cls = tl.length > 1 ? "w2" : "";
    if (i < count && state.exact[i] === tl) cls += " hl-exact";
    else if (presentSet.has(tl)) cls += " hl-present";
    return `<span class="${cls.trim()}">${tl}</span>`;
  }).join("");

  const totalInLen = ENTRIES_BY_LEN[entry.len].length;
  const lmNote = LM_TIERS.has(entry.tier) ? t("inLM") : t("notInLM");
  $("#detMeta").innerHTML =
    `<div><b>${entry.len} ${t("lettersUnit")}</b><small>${t("detLen")}</small></div>` +
    `<div><b><i class="dot ${entry.tier}" style="display:inline-block;margin-right:5px"></i>${t(entry.tier)}</b><small>${lmNote}</small></div>` +
    `<div><b>#${entry.rank.toLocaleString("en-US")}</b><small>${t("detRank")} / ${totalInLen.toLocaleString("en-US")}</small></div>`;

  const wiktLang = state.lang === "en" ? "en" : "hy";
  $("#detWikt").href = `https://${wiktLang}.wiktionary.org/wiki/${encodeURIComponent(entry.word)}`;
  $("#scrimDetail").classList.add("open");
}

function renderCorpusInfo(){
  const total = ALL_ENTRIES.length.toLocaleString("en-US");
  const b = META.bands;
  const bands = state.lang === "en"
    ? `Bands — easy ≥ ${b.easy_min} · medium ≥ ${b.medium_min} · hard ≥ ${b.hard_min} · LM = easy + medium + hard · impossible ≥ ${b.impossible_min} (plus curated non-standard words)`
    : `Շերտեր — դյուրին ≥ ${b.easy_min} · միջին ≥ ${b.medium_min} · դժվար ≥ ${b.hard_min} · ԼՄ = դյուրին + միջին + դժվար · անհնար ≥ ${b.impossible_min} (ներառյալ ոչ ստանդարտ բառերը)`;
  $("#corpusInfo").innerHTML =
    `<b>${META.corpus}</b><br>` +
    (state.lang === "en"
      ? `${total} words · ${(META.tokens_scored/1e6).toFixed(1)} M tokens scored · validated with ${META.validator}`
      : `${total} բառ · ${(META.tokens_scored/1e6).toFixed(1)} մլն բառաձև · ստուգված՝ ${META.validator}`) +
    `<br>${bands}`;
}

function applyLang(){
  document.documentElement.lang = state.lang === "en" ? "en" : "hy";
  $$("[data-i18n]").forEach(el => {
    const k = el.dataset.i18n;
    if (I18N[state.lang][k] !== undefined) el.textContent = I18N[state.lang][k];
  });
  $("#btnLang").textContent = state.lang === "en" ? "ՀՅ" : "EN";
  renderControls();
  renderFilterUI();
  renderCorpusInfo();
  runSearch();
}

function applyTheme(){
  document.documentElement.dataset.theme = state.theme;
  $("#btnTheme").textContent = state.theme === "dark" ? "☀" : "☾";
}

function showToast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._id);
  showToast._id = setTimeout(() => el.classList.remove("show"), 1600);
}

async function copyText(txt){
  if (!txt) return;
  try{
    await navigator.clipboard.writeText(txt);
    showToast(t("copied"));
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); showToast(t("copied")); }catch(_){}
    ta.remove();
  }
}

function resetAll(){
  state.tier = "all";
  state.exact.fill("");
  state.notAt = Array.from({length: MAX_LEN}, () => []);
  state.contains = [];
  state.exclude = [];
  state.yellowRule = false;
  $("#chkYellow").checked = false;
  state.target = { type: "exact", idx: 0 };
  state.limit = 240;
  renderControls();
  renderFilterUI();
  runSearch();
}

function applyExample(){
  // Crisp real Armenian example: 5-letter words with մ at 1st, ա at 4th, ն at 5th (մ _ _ ա ն)
  state.len = 5;
  state.tier = "all";
  state.exact = ["մ","","","ա","ն",""];
  state.notAt = Array.from({length: MAX_LEN}, () => []);
  state.contains = [];
  state.exclude = [];
  state.yellowRule = false;
  $("#chkYellow").checked = false;
  state.target = { type: "exact", idx: 1 };
  state.limit = 240;
  renderControls();
  renderFilterUI();
  runSearch();
}

/* ---------- 8. Wiring ---------- */
function closeModals(){ $$(".scrim").forEach(s => s.classList.remove("open")); }

function wire(){
  $("#btnLang").onclick = () => {
    state.lang = state.lang === "hy" ? "en" : "hy";
    saveSharedPref({ lang: state.lang });
    applyLang();
  };
  $("#btnTheme").onclick = () => {
    state.theme = state.theme === "light" ? "dark" : "light";
    saveSharedPref({ theme: state.theme });
    applyTheme();
  };
  $("#btnHelp").onclick = () => { renderCorpusInfo(); $("#scrimHelp").classList.add("open"); };

  $("#segLen").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.len = +b.dataset.len;
    state.limit = 240;
    if ((state.target.type === "exact" || state.target.type === "notAt") && state.target.idx >= activeSlotCount()){
      state.target.idx = activeSlotCount() - 1;
    }
    renderControls();
    renderFilterUI();
    runSearch();
  };

  $("#segTier").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.tier = b.dataset.tier;
    state.limit = 240;
    renderControls();
    runSearch();
  };

  $("#breakdown").onclick = (e) => {
    const b = e.target.closest("button[data-bd]"); if (!b) return;
    state.tier = b.dataset.bd;
    state.limit = 240;
    renderControls();
    runSearch();
  };

  $("#slotsGrid").onclick = (e) => {
    const clr = e.target.closest("[data-clear-exact]");
    if (clr){
      const idx = +clr.dataset.clearExact;
      state.exact[idx] = "";
      state.limit = 240;
      setTarget({ type: "exact", idx });
      runSearch();
      return;
    }
    const rmNot = e.target.closest("[data-rm-not]");
    if (rmNot){
      const [i, j] = rmNot.dataset.rmNot.split(":").map(Number);
      state.notAt[i].splice(j, 1);
      state.limit = 240;
      setTarget({ type: "notAt", idx: i });
      runSearch();
      return;
    }
    const exEl = e.target.closest("[data-slot-exact]");
    if (exEl){ setTarget({ type: "exact", idx: +exEl.dataset.slotExact }); return; }
    const naEl = e.target.closest("[data-slot-not]");
    if (naEl){ setTarget({ type: "notAt", idx: +naEl.dataset.slotNot }); return; }
  };

  $("#fieldContains").onclick = (e) => {
    const rm = e.target.closest("[data-rm-contains]");
    if (rm){
      state.contains.splice(+rm.dataset.rmContains, 1);
      state.limit = 240;
      setTarget({ type: "contains" });
      runSearch();
      return;
    }
    setTarget({ type: "contains" });
  };

  $("#fieldExclude").onclick = (e) => {
    const rm = e.target.closest("[data-rm-exclude]");
    if (rm){
      state.exclude.splice(+rm.dataset.rmExclude, 1);
      state.limit = 240;
      setTarget({ type: "exclude" });
      runSearch();
      return;
    }
    setTarget({ type: "exclude" });
  };

  $("#btnClearPos").onclick = () => {
    state.exact.fill("");
    state.notAt = Array.from({length: MAX_LEN}, () => []);
    state.limit = 240;
    setTarget({ type: "exact", idx: 0 });
    runSearch();
  };
  $("#btnClearContains").onclick = () => {
    state.contains = [];
    state.limit = 240;
    renderChipFields();
    runSearch();
  };
  $("#btnClearExclude").onclick = () => {
    state.exclude = [];
    state.limit = 240;
    renderChipFields();
    runSearch();
  };

  $("#chkYellow").onchange = (e) => {
    state.yellowRule = e.target.checked;
    state.limit = 240;
    runSearch();
  };

  $("#btnToggleKb").onclick = () => {
    state.kbOpen = !state.kbOpen;
    renderKbTarget();
  };

  $("#btnReset").onclick = resetAll;
  $("#btnExample").onclick = applyExample;

  $("#selSort").onchange = (e) => {
    state.sort = e.target.value;
    state.limit = 240;
    runSearch();
  };

  $("#btnCopy").onclick = () => {
    if (!state.lastMatches.length) return;
    copyText(state.lastMatches.map(e => e.word).join("\n"));
  };

  $("#wordGrid").onclick = (e) => {
    const card = e.target.closest(".wcard"); if (!card) return;
    const entry = state.lastMatches[+card.dataset.idx];
    if (entry) openWordDetail(entry);
  };

  $("#detCopy").onclick = () => {
    if (state.selectedWord) copyText(state.selectedWord.word);
  };

  $$(".scrim").forEach(s => {
    s.addEventListener("click", (e) => {
      if (e.target === s || e.target.hasAttribute("data-close")) closeModals();
    });
  });

  document.addEventListener("paste", (e) => {
    if ($$(".scrim.open").length) return;
    const txt = (e.clipboardData || window.clipboardData)?.getData("text");
    if (txt){ e.preventDefault(); handlePastePattern(txt); }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape"){ closeModals(); return; }
    if ($$(".scrim.open").length) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && (e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.target.type === "checkbox")) return;

    if (e.key === "Backspace"){ e.preventDefault(); handleBackspace(); return; }
    if (e.key === "Delete"){
      if (state.target.type === "exact"){
        e.preventDefault();
        state.exact[state.target.idx] = "";
        renderFilterUI(); runSearch();
      }
      return;
    }
    if (e.key === "ArrowLeft" && (state.target.type === "exact" || state.target.type === "notAt")){
      e.preventDefault();
      if (state.target.idx > 0) setTarget({ type: state.target.type, idx: state.target.idx - 1 });
      return;
    }
    if (e.key === "ArrowRight" && (state.target.type === "exact" || state.target.type === "notAt")){
      e.preventDefault();
      if (state.target.idx + 1 < activeSlotCount()) setTarget({ type: state.target.type, idx: state.target.idx + 1 });
      return;
    }
    if (e.key === "ArrowDown" && state.target.type === "exact"){
      e.preventDefault();
      setTarget({ type: "notAt", idx: state.target.idx });
      return;
    }
    if (e.key === "ArrowUp" && state.target.type === "notAt"){
      e.preventDefault();
      setTarget({ type: "exact", idx: state.target.idx });
      return;
    }
    if ((e.key === " " || e.key === "_" || e.key === "?" || e.key === "*") && state.target.type === "exact"){
      e.preventDefault();
      handleWildcard();
      return;
    }
    if (e.key.length === 1 && /[\u0531-\u0556\u0561-\u0587]/.test(e.key)){
      e.preventDefault();
      handleLetterInput(e.key);
    }
  });
}

/* ---------- 9. Boot ---------- */
function boot(){
  applyTheme();
  buildKeyboard();
  wire();
  applyLang();
}
boot();

window.HYEXPLORER = {
  state, ALL_ENTRIES, ENTRIES_BY_LEN, toTiles, compareArmenian,
  matchesConstraints, runSearch, handleLetterInput, handleBackspace,
  handleWildcard, handlePastePattern, setTarget, resetAll, applyExample
};
